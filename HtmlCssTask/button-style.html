<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button-Styling</title>
  <style>
    .button {
      background-color: lightcyan;
      color: black;
      border-radius: 8px;
      border: 2px solid black;                            
      padding:10px;                         
    }
    .button:hover {
      background-color: darkcyan
    }
  </style>
</head>
<body>
  <h2>Basic Button Styling</h2>
  <p>Add background color, border-radius, hover effects.</p>
  <button class="button">Click Me</button>
</body>
</html>
