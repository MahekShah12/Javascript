<script>
let numbers = [21, 19, 16, 18, 20];
console.log("Original Array:", numbers);

// Add element 22 to the end
numbers.push(22);
console.log("After push(22):", numbers);

// Remove the last element
numbers.pop();
console.log("After pop():", numbers);

// Print array length
console.log("Array length:", numbers.length);

// Square each element
let squares = numbers.map(num => num * num);
console.log("Squares:", squares);

// Cube each element (you labeled as "Triples" but it's cube)
let triple = numbers.map(num => num * num * num);
console.log("Triples:", triple);
</script>
