<!DOCTYPE html>
<html>
  <head>
    <title>The Fair Grader</title>
  </head>
  <body>
    <h2>Enter Marks:</h2>
    <label>Marks 1:</label>
    <input type="number" id="marks1" /><br />
    <label>Marks 2:</label>
    <input type="number" id="marks2" /><br />
    <label>Marks 3:</label>
    <input type="number" id="marks3" /><br />
    <button onclick="Grade()">Grade</button>
    <h3 id="result"></h3>
    <script>
      function Grade() {
        let marks1 = parseFloat(document.getElementById("marks1").value);
        let marks2 = parseFloat(document.getElementById("marks2").value);
        let marks3 = parseFloat(document.getElementById("marks3").value);
        let avg = (marks1 + marks2 + marks3) / 3;
        let grade = "";
        if (avg >= 90) {
          grade = "A";
        } else if (avg >= 70) {
          grade = "B";
        } else {
          grade = "C";
        }
        document.getElementById("result").innerText = `Grade: ${grade}`;
      }
    </script>
  </body>
</html>
