<script>
  let password = prompt("Enter Password:");
  let passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
  if (passwordRegex.test(password)) {
    document.write("Password: " + password + " → Strong<br><br>");
  } else {
    document.write("Password: " + password + " → Weak<br><br>");
  }
</script>
