<script>
    let day=prompt("enter the day of the week: ")
    switch(day){
        case "Monday":
            console.log("first day")
            break;
        case "Tuesday":
            console.log("second day")
            break;
        case "Wednesday":
            console.log("third day")
            break;
        case "Thursday":
            console.log("fourth day")
            break;
        case "Friday":
            console.log("fifth day")
            break;
        case "Saturday":
            console.log("sixth day")
            break;
        case "Sunday":
            console.log("seventh day")
            break;
        default:
            console.log("invalid input")
    }
</script>
