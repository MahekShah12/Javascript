<!DOCTYPE html>
<html>
<head>
<style>
  body { text-align:center; font-family:sans-serif; }
  #show { font-size:80px; margin-top:20px; }
</style>
</head>
<body id="main">

<h3>Weather Mood</h3>

<select id="mood" onchange="changeMood()">
  <option value="">--select--</option>
  <option value="sunny">sunny</option>
  <option value="rainy">rainy</option>
  <option value="cold">cold</option>
</select>

<p id="show"></p>

<script>
function changeMood(){
  let m = document.getElementById("mood").value;
  let s = document.getElementById("show");
  let b = document.getElementById("main");

  if(m=="sunny"){
    b.style.backgroundColor="yellow";
    s.innerHTML="☀";
  }
  else if(m=="rainy"){
    b.style.backgroundColor="lightblue";
    s.innerHTML="🌧";
  }
  else if(m=="cold"){
    b.style.backgroundColor="lightcyan";
    s.innerHTML="❄";
  }
  else{
    b.style.backgroundColor="white";
    s.innerHTML="";
  }
}
</script>

</body>
</html>
