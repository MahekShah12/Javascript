<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Dashboard</title>
<style>
  body {
    font-family: Verdana, sans-serif;
    text-align: center;
    transition: 0.4s;
    padding: 20px;
  }
  .light { background: #fff; color: #000; }
  .dark { background: #121212; color: #fff; }
  #controls button, select { margin: 6px; padding: 8px 14px; border: none; border-radius: 5px; cursor: pointer; }
  #resetPrefs { background: #e74c3c; color: #fff; }
</style>
</head>
<body>
<h1 id="welcomeText">Welcome!</h1>
<div id="controls">
  <input type="text" id="userName" placeholder="Enter your name">
  <button id="saveUser">Save Name</button>
  <button id="themeBtn">Switch Theme</button>
  <select id="fontChooser">
    <option value="small">Small</option>
    <option value="medium">Medium</option>
    <option value="large">Large</option>
  </select>
  <button id="resetPrefs">Reset Preferences</button>
</div>
<p id="tabCounter"></p>
<h3>Feedback</h3>
<textarea id="feedback" rows="5" cols="40" placeholder="Your feedback..."></textarea>
<script>
let theme = localStorage.getItem("theme") || "light";
document.body.className = theme;
document.getElementById("themeBtn").onclick = () => {
  theme = theme === "light" ? "dark" : "light";
  document.body.className = theme;
  localStorage.setItem("theme", theme); };
let font = localStorage.getItem("fontSize") || "medium";
document.body.style.fontSize = font === "small" ? "14px" : font === "large" ? "20px" : "16px";
document.getElementById("fontChooser").value = font;
document.getElementById("fontChooser").onchange = e => {
  font = e.target.value;
  document.body.style.fontSize = font === "small" ? "14px" : font === "large" ? "20px" : "16px";
  localStorage.setItem("fontSize", font); };
const userField = document.getElementById("userName");
const welcome = document.getElementById("welcomeText");
const savedUser = localStorage.getItem("username");
if (savedUser) welcome.textContent = `Welcome, ${savedUser}!`;
document.getElementById("saveUser").onclick = () => {
  const user = userField.value.trim();
  if (user) {
    localStorage.setItem("username", user);
    welcome.textContent = `Welcome, ${user}!`; } };
let visits = Number(sessionStorage.getItem("visits")) || 0;
visits++;
sessionStorage.setItem("visits", visits);
document.getElementById("tabCounter").textContent = `This tab has been refreshed ${visits} time(s).`;
const fb = document.getElementById("feedback");
fb.value = sessionStorage.getItem("feedback") || "";
fb.addEventListener("input", () => sessionStorage.setItem("feedback", fb.value));
document.getElementById("resetPrefs").onclick = () => {
  localStorage.clear();
  location.reload(); };
</script></body>
</html>
